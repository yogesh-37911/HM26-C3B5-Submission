services:
  # Backend Web Service (FastAPI)
  - type: web
    name: mysuru-pulse-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: src/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true

  # Frontend Static Site (React + Vite)
  - type: web
    name: mysuru-pulse-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: src/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
